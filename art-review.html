<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五城建筑 · 设计与实物</title>
<style>
:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#263e37;background:#f0efe6}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;background:#203e36;color:#fff9e9;display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:22px;margin:4px 0}p{font-size:13px;line-height:1.65;margin:6px 0;color:#65776e}header p{color:#ccd3bd}a{color:inherit}nav{display:flex;gap:12px;flex-wrap:wrap;padding:16px 28px;background:#faf8ed;border-bottom:1px solid #d9dece}label{font-size:12px;display:flex;gap:8px;align-items:center}select,button{font:inherit;padding:10px 13px;border:1px solid #c8d1c1;border-radius:7px;background:#fffdf4;color:#263e37;cursor:pointer}button[aria-pressed=true]{background:#2f6554;color:white}main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,1fr);gap:18px;padding:18px 28px}.panel{border:1px solid #d5dccd;border-radius:12px;overflow:hidden;background:#fffdf6;min-width:0}.bar{padding:13px 18px;border-bottom:1px solid #dce0d3;display:flex;justify-content:space-between;align-items:center;gap:10px}.bar b{font-size:14px}.bar span{font-size:12px;color:#7b847a}#stage{height:clamp(300px,calc(100vh - 350px),490px);position:relative;touch-action:none;background:#e9e8df}canvas{display:block;width:100%;height:100%}.views{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px}.views button{font-size:12px}.caption{padding:0 18px 14px;min-height:45px}#reference{display:block;width:100%;height:auto}.reference-scroll{max-height:620px;overflow:auto;background:white}#status{font-size:12px}#error{color:#9f4935}footer{padding:0 28px 22px;color:#6a776b;font-size:12px}.version{font-size:11px;letter-spacing:2px}button:focus-visible,select:focus-visible{outline:3px solid #cb9d4d;outline-offset:2px}@media(max-width:760px){header,nav{padding:15px}main{grid-template-columns:1fr;padding:12px}#stage{height:380px}.reference-scroll{max-height:520px}h1{font-size:19px}header a{font-size:12px}}
</style></head><body>
<header><div><div class="version">环城大富翁 · 建筑验收</div><h1>五城建筑 · 设计与实物</h1><p>左侧直接显示游戏使用的模型，右侧为生成的三视图设计。</p></div><a href="./">返回游戏 ↗</a></header>
<nav><label>地区<select id="region"><option value="classic">法式街区 · 经典环线</option><option value="compact">京都町屋 · 紧凑冲突</option><option value="expansion">纽约都会 · 都市环线</option><option value="harbor">地中海岸 · 潮汐港湾</option><option value="alpine" selected>阿尔卑斯 · 云岭温泉</option></select></label><label>建筑<select id="family"></select></label><label>等级<select id="level"><option value="1">一级</option><option value="2" selected>二级</option><option value="3">三级</option></select></label></nav>
<main><section class="panel"><div class="bar"><b id="title">模型载入中</b><span id="status"></span></div><div id="stage" aria-label="可旋转的建筑模型"></div><div class="views" aria-label="建筑观察方向"><button data-view="iso" aria-pressed="true">立体视角</button><button data-view="front" aria-pressed="false">正面</button><button data-view="side" aria-pressed="false">右侧</button><button data-view="back" aria-pressed="false">背面</button><button data-view="left" aria-pressed="false">左侧</button></div><p class="caption" id="caption">拖动旋转，滚轮缩放。升级会增加楼层、附楼或屋顶结构。</p><p id="error" class="caption" hidden></p></section>
<section class="panel"><div class="bar"><b>三视图设计</b><a id="reference-link" target="_blank">展开原图 ↗</a></div><div class="reference-scroll"><img id="reference" alt="该地区建筑的正面、右侧与背面设计"></div></section></main>
<footer>普通建筑、公共建筑与双格地标均按地区重新建模。三视图用于约束轮廓和构件；游戏模型保留适合手机辨识的层次。</footer>
<script type="module" src="art-review.js?v=20261028-global-roofs2"></script></body></html>
