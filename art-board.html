<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五城建筑 · 整套对照</title>
<style>
:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#263e37;background:#f0efe6}*{box-sizing:border-box}body{margin:0}header{padding:18px 24px;background:#203e36;color:#fff9e9;display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:21px;margin:3px 0}header p{font-size:12px;color:#ccd3bd;margin:4px 0}a{color:inherit}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:13px 24px}select,button{font:inherit;font-size:13px;padding:9px 12px;border:1px solid #c8d1c1;border-radius:7px;background:#fffdf4;color:#263e37;cursor:pointer}button[aria-pressed=true]{background:#2f6554;color:white}#status{font-size:12px;color:#53695e}#board{margin:0 20px 20px;position:relative;background:#e9e8df;border:1px solid #d5dccd;border-radius:10px;overflow:hidden}#board canvas{position:absolute;inset:0;display:block;width:100%;height:100%;pointer-events:none}#cards{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}.card{height:154px;position:relative;border-right:1px solid #d5dccd;border-bottom:1px solid #d5dccd;text-decoration:none;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 11px;font-size:12px;gap:3px}.card b{font-weight:600}.card span{font-size:10px;color:#6b7d71}.card:hover{box-shadow:inset 0 0 0 2px #5c8b71}.card:focus-visible{outline:3px solid #bd903c;outline-offset:-3px}#error{padding:0 24px;color:#a34c3c}@media(max-width:760px){header,nav{padding:14px}h1{font-size:18px}#board{margin:0 10px 15px}#cards{grid-template-columns:repeat(3,minmax(0,1fr))}.card{height:166px;padding:7px;font-size:11px}header a{font-size:12px}}
.family-review #cards{grid-template-columns:repeat(3,minmax(0,1fr))}.family-review .card{height:340px}@media(max-width:760px){.family-review .card{height:190px}}
</style></head><body>
<header><div><h1>五城建筑 · 整套对照</h1><p>同一地区的普通建筑、三级升级与公共建筑。点击单栋可对照建模三视图。</p></div><a href="./art-review.html">查看单栋 ↗</a></header>
<nav><select id="region" aria-label="地区"><option value="classic">法式街区</option><option value="compact">京都町屋</option><option value="expansion">纽约都会</option><option value="harbor">地中海岸</option><option value="alpine">阿尔卑斯</option></select><button data-view="iso" aria-pressed="true">立体视角</button><button data-view="front" aria-pressed="false">正面</button><button data-view="back" aria-pressed="false">背面</button><span id="status" role="status">模型载入中</span></nav>
<p id="error" hidden></p><main id="board"><div id="cards"></div></main>
<script type="module" src="art-board.js?v=20261025-landmarks3"></script></body></html>
