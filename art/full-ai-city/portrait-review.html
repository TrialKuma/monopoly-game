<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>竖屏网页布局验收</title><style>
*{box-sizing:border-box}body{margin:0;background:#d9dfd8;font-family:system-ui,'Microsoft YaHei',sans-serif;color:#263e37;display:flex;min-height:100vh;align-items:flex-start;justify-content:center;gap:24px;padding:18px}.note{width:230px;font-size:13px;line-height:1.8}h1{font-size:20px;margin:0 0 12px}p{margin:8px 0}label{display:block;margin:14px 0}select{font:inherit;padding:8px;width:100%;border:1px solid #aebfb0;border-radius:6px;background:#fffdf2}iframe{flex:none;width:390px;height:844px;border:0;border-radius:14px;box-shadow:0 4px 30px #233b3625;background:white}a{color:inherit}@media(max-width:680px){body{padding:10px;display:block}.note{width:auto;max-width:390px;margin:auto}iframe{display:block;margin:auto}}
</style></head><body><aside class="note"><h1>竖屏布局验收</h1><p>下方加载完整游戏。画面使用独立的网页视口，触发游戏本身的手机布局。</p><label>屏幕尺寸<select id="size"><option value="390,844">390 × 844</option><option value="360,740">360 × 740</option><option value="430,932">430 × 932</option></select></label><p id="stage-note"></p><a href="../../art-board.html">整套建筑对照 ↗</a></aside><iframe id="phone" title="竖屏游戏" src="../../"></iframe><script>
const query=new URLSearchParams(location.search),phone=document.getElementById('phone');
if(query.get('artStage')==='candidate'){phone.src='../../?artStage=candidate';document.getElementById('stage-note').textContent='当前检查未发布建筑集。';}
const device=document.createElement('div');phone.before(device);device.append(phone);device.style.cssText='position:relative;flex:none;margin:auto 0;align-self:flex-start';phone.style.cssText='position:absolute;left:0;top:0;transform-origin:top left';
function fit(){const [width,height]=document.getElementById('size').value.split(',').map(Number),scale=Math.min(1,(innerHeight-36)/height,(innerWidth-30)/width);phone.style.width=width+'px';phone.style.height=height+'px';phone.style.transform='scale('+scale+')';device.style.width=(width*scale)+'px';device.style.height=(height*scale)+'px';}
document.getElementById('size').addEventListener('change',fit);addEventListener('resize',fit);fit();
</script></body></html>
