<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <title>建筑修复对照 · 环城大富翁</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#283832;background:#f5f3ee;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}a{color:#326956;text-underline-offset:3px}header,main,footer{max-width:1600px;margin:auto}header{padding:30px 28px 18px}.eyebrow{margin:0 0 8px;color:#6b786d;font-size:11px;letter-spacing:.15em}h1{margin:0;font-size:clamp(22px,2.4vw,32px);font-weight:650;letter-spacing:-.03em}.heading{display:flex;align-items:center;justify-content:space-between;gap:16px}.heading>a{font-size:13px;white-space:nowrap}.intro{margin:9px 0 0;color:#66756b;line-height:1.6;font-size:14px}.toolbar{margin:20px 0 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}.choice{display:flex;align-items:center;gap:10px;font-size:13px}.choice select{max-width:calc(100vw - 100px);background:#fff;border:1px solid #ced5c9;padding:11px 35px 11px 12px;border-radius:9px;color:inherit}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.group{display:flex;gap:4px}button{min-height:42px;border:1px solid #d2d9ce;border-radius:8px;background:#fff;color:#43574a;padding:9px 13px;cursor:pointer}button:hover{background:#edf2e9}button[aria-pressed=true]{color:#fff;background:#315f4e;border-color:#315f4e}button:focus-visible,select:focus-visible,.stage:focus-visible{outline:3px solid #d4a65e;outline-offset:3px}.zoom button{min-width:42px;padding:8px}.hint{font-size:12px;color:#7b847a;margin:12px 0 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:0 28px}.panel{min-width:0;border:1px solid #d8dfd2;border-radius:15px;background:#fff;overflow:hidden}.panel.after{border-color:#9eb7a6}.panel-head{padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #e8ece3}.panel-head h2{font-size:15px;margin:0;font-weight:650}.badge{font-size:11px;white-space:nowrap;background:#f0f2eb;color:#697a6c;padding:4px 7px;border-radius:5px}.after .badge{color:#315f4e;background:#e8f0e7}.stage,.reference-stage{height:clamp(300px,36vw,520px);position:relative;background:#eeeee9}.stage{touch-action:none;cursor:grab}.stage:active{cursor:grabbing}.stage canvas{display:block;width:100%;height:100%}.reference-stage{display:flex;align-items:center;justify-content:center;background:#fff}.reference-stage img{width:100%;height:100%;object-fit:contain}.panel-foot{min-height:56px;padding:12px 17px;border-top:1px solid #e8ece3;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:#788375}.panel-foot a{white-space:nowrap}.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#6e7c70;font-size:13px;pointer-events:none}.loading[hidden]{display:none}.loading.error{color:#984c37;background:#eeeee9}.notes{padding:20px 28px 0;display:grid;grid-template-columns:1fr 1fr;gap:28px}.notes h2{font-size:13px;margin:0 0 7px;color:#3a5949}.notes p{font-size:13px;line-height:1.7;color:#6a766c;margin:0}footer{padding:24px 28px 30px;font-size:12px;color:#8b9287;line-height:1.6}#page-error{margin:0 28px 18px;padding:16px;background:#fff0e8;border:1px solid #e8c9b8;border-radius:10px;color:#8a4634;font-size:13px}#page-error[hidden]{display:none}@media(max-width:800px){header{padding:22px 16px 16px}.heading{align-items:flex-start}.heading>a{padding-top:5px}.intro{font-size:13px}.toolbar{align-items:flex-start}.controls{width:100%;justify-content:space-between;gap:6px}.group{gap:3px}button{padding:8px 11px}.zoom button{min-width:39px}.grid{grid-template-columns:1fr;padding:0 12px;gap:13px}.stage,.reference-stage{height:clamp(290px,92vw,440px)}.panel-head{padding:13px 16px}.panel-foot{min-height:47px}.notes{grid-template-columns:1fr;gap:14px;padding:20px 16px 0}footer{padding:20px 16px 26px}#page-error{margin:0 12px 15px}.hint{line-height:1.6}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">环城大富翁 · 建筑修复</p>
    <div class="heading"><h1 id="title">京都町屋 · 二级住宅</h1><a href="/art-review.html?map=compact&family=villa&level=2">建筑查看 ↗</a></div>
    <p class="intro">对着原始设计，检查屋檐、窗格和墙面的变化。</p>
    <div class="toolbar">
      <label class="choice">建筑<select id="asset" aria-label="选择对比建筑"></select></label>
      <div class="controls">
        <div class="group" role="group" aria-label="同步观察方向">
          <button type="button" data-view="front" aria-pressed="true">正面</button>
          <button type="button" data-view="side" aria-pressed="false">右侧</button>
          <button type="button" data-view="back" aria-pressed="false">背面</button>
          <button type="button" data-view="iso" aria-pressed="false">斜视</button>
        </div>
        <div class="group zoom" role="group" aria-label="同步缩放">
          <button type="button" id="zoom-out" aria-label="同时缩小两个模型">−</button>
          <button type="button" id="reset" aria-label="恢复正面和默认大小">复位</button>
          <button type="button" id="zoom-in" aria-label="同时放大两个模型">＋</button>
        </div>
      </div>
    </div>
    <p class="hint">拖动任一模型，两边同步旋转；滚轮、双指或 ＋ / − 缩放。两边使用相同光照与镜头尺度。</p>
  </header>
  <main>
    <p id="page-error" role="alert" hidden></p>
    <div class="grid">
      <section class="panel">
        <div class="panel-head"><h2>三视图设计</h2><span class="badge">原始输入</span></div>
        <div class="reference-stage"><img id="reference" alt="京都町屋二级住宅正面设计" decoding="async"></div>
        <div class="panel-foot"><span id="reference-label">正面设计</span><a id="reference-link" target="_blank" rel="noopener">查看原图 ↗</a></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>修复前</h2><span class="badge" id="before-badge">当前游戏模型</span></div>
        <div id="before-stage" class="stage" tabindex="0" role="region" aria-label="修复前模型，可拖动旋转"><div class="loading" role="status">载入模型…</div></div>
        <div class="panel-foot"><span id="before-info">正在载入</span><a id="before-link" target="_blank" rel="noopener">模型文件 ↗</a></div>
      </section>
      <section class="panel after">
        <div class="panel-head"><h2>修复后</h2><span class="badge" id="after-badge">修复候选</span></div>
        <div id="after-stage" class="stage" tabindex="0" role="region" aria-label="修复后模型，可拖动旋转"><div class="loading" role="status">载入模型…</div></div>
        <div class="panel-foot"><span id="after-info">正在载入</span><a id="after-link" target="_blank" rel="noopener">模型文件 ↗</a></div>
      </section>
    </div>
    <div class="notes">
      <section><h2>这次调整</h2><p id="changes">正在载入说明。</p></section>
      <section><h2>仍需核对</h2><p id="limits">以实际模型为准，检查各面轮廓与小构件。</p></section>
    </div>
  </main>
  <footer>设计图用于对照，模型采用同一套中性日光。斜视时保留正面设计图，便于核对主要构件。</footer>
  <script type="module" src="./comparison.js?v=20261024-4"></script>
</body>
</html>
